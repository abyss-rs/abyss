[package]
name = "abyss-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/abyss-tui"
readme = "README.md"
description = "Fast, cross-platform dual-pane terminal file manager for local, cloud, and Kubernetes storage"
keywords = ["tui", "file-manager", "ratatui", "storage", "cloud"]
categories = ["command-line-utilities", "filesystem"]
default-run = "abyss"


[[bin]]
name = "abyss"
path = "src/main.rs"

[features]
default = ["remote"]
s3 = ["abyss-core/s3"]
azure = ["abyss-core/azure"]
gcs = ["abyss-core/gcs"]
kubernetes = ["abyss-core/kubernetes"]
sftp = ["abyss-core/sftp"]
ftp = ["abyss-core/ftp"]
remote = ["abyss-core/remote"]

[dependencies]
abyss-core.workspace = true
# bat's curated syntax and theme assets, without its CLI: no clap, no git2, and
# regex-fancy keeps highlighting pure Rust rather than linking oniguruma.
bat.workspace = true
cleaner-tui.workspace = true
clap.workspace = true
crossterm.workspace = true
percent-encoding.workspace = true
portable-pty.workspace = true
quichash-core.workspace = true
ratatui.workspace = true
shell-words.workspace = true
syntect.workspace = true
tempfile.workspace = true
tui-term.workspace = true
sysinfo.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
vt100.workspace = true
zeroize.workspace = true

