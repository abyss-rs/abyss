[package]
name = "abyss-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Frontend-neutral file, archive, hash, sync, and storage engine for Abyss"
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = ["remote"]
tokio = ["dep:tokio", "dep:tokio-util", "dep:async-trait", "dep:futures-util", "dep:rustls"]
s3 = ["dep:object_store", "object_store/aws", "tokio"]
azure = ["dep:object_store", "object_store/azure", "tokio"]
gcs = ["dep:object_store", "object_store/gcp", "tokio"]
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:ciborium", "tokio"]
sftp = ["dep:ssh2", "tokio"]
ftp = ["dep:suppaftp", "dep:webpki-roots", "tokio"]
remote = ["s3", "azure", "gcs", "kubernetes", "sftp", "ftp"]
kube-helper = ["kubernetes"]

[[bin]]
name = "abyss-kube-helper"
path = "src/bin/abyss-kube-helper.rs"
required-features = ["kube-helper"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
brotli = "8.0.4"
bytes = "1.12.1"
bzip2 = "0.6.1"
ciborium = { version = "0.2.2", optional = true }
blake3 = { version = "1.8", features = ["rayon", "std"] }
rayon = "1.12"
directories = "6.0.0"
flate2 = "1.1.9"
futures-util = { version = "0.3.34", optional = true }
# ripgrep's own search libraries, and the gitignore-aware walker fd is built on.
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
k8s-openapi = { version = "0.28.0", features = ["v1_36"], optional = true }
kube = { version = "4.2.0", features = ["client", "config", "ring", "rustls-tls", "ws"], optional = true }
libc = "0.2.189"
lz4_flex = { version = "0.14.0", features = ["frame"] }
lzma-rust2 = { version = "0.18.1", default-features = false, features = ["std", "encoder", "lzip", "xz"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"], optional = true }
percent-encoding = "2.3.2"
quichash-core = { path = "../../../quichash/crates/quichash-core" }
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.1"
serde_json = "1.0.151"
sevenz-rust2 = "0.21.4"
zstd = { version = "0.13", features = ["zstdmt"] }
sha2 = "0.11.0"
ssh2 = { version = "0.9.6", optional = true }
signal-hook = "0.4"
suppaftp = { version = "10.0.1", features = ["tokio-rustls-ring", "deprecated"], optional = true }
tar = "0.4.46"
tempfile = "3"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"], optional = true }
tokio-util = { version = "0.7.19", features = ["io"], optional = true }
toml = "1.1.4"
trash = "5.2.6"
unarc-rs = "0.6.2"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
webpki-roots = { version = "1.0.9", optional = true }
zeroize = "1"
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2", "xz", "zstd"] }
object_store = { version = "0.14.1", default-features = false, optional = true }
lofty = "0.25.1"
chrono = "0.4.45"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }
