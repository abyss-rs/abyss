[package]
name = "abyss-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/abyss-core"
readme = "README.md"
description = "Frontend-neutral file, archive, hash, sync, and storage engine for Abyss"
keywords = ["file-manager", "vfs", "archive", "storage", "sync"]
categories = ["filesystem", "command-line-utilities"]
autobins = false


[features]
default = ["remote"]
tokio = ["dep:tokio", "dep:tokio-util", "dep:async-trait", "dep:futures-util", "dep:rustls"]
s3 = ["dep:object_store", "object_store/aws", "tokio"]
azure = ["dep:object_store", "object_store/azure", "tokio"]
gcs = ["dep:object_store", "object_store/gcp", "tokio"]
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:ciborium", "tokio"]
sftp = ["dep:ssh2", "tokio"]
ftp = ["dep:suppaftp", "dep:webpki-roots", "tokio"]
remote = ["s3", "azure", "gcs", "kubernetes", "ftp"]
kube-helper = ["kubernetes"]

[[bin]]
name = "abyss-kube-helper"
path = "src/bin/abyss-kube-helper.rs"
required-features = ["kube-helper"]

[dependencies]
async-trait = { workspace = true, optional = true }
brotli.workspace = true
bytes.workspace = true
bzip2.workspace = true
ciborium = { workspace = true, optional = true }
blake3.workspace = true
rayon.workspace = true
directories.workspace = true
flate2.workspace = true
futures-util = { workspace = true, optional = true }
# ripgrep's own search libraries, and the gitignore-aware walker fd is built on.
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
libc.workspace = true
lz4_flex.workspace = true
lzma-rust2.workspace = true
rustls = { workspace = true, optional = true }
percent-encoding.workspace = true
quichash-core.workspace = true
serde.workspace = true
similar.workspace = true
serde_json.workspace = true
sevenz-rust2.workspace = true
zstd.workspace = true
sha2.workspace = true
ssh2 = { workspace = true, optional = true }
signal-hook.workspace = true
suppaftp = { workspace = true, optional = true }
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
toml.workspace = true
trash.workspace = true
unarc-rs.workspace = true
url.workspace = true
uuid.workspace = true
webpki-roots = { workspace = true, optional = true }
zeroize.workspace = true
zip.workspace = true
object_store = { workspace = true, optional = true }
lofty.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

