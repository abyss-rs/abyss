name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      task_to_run:
        description: 'Which part of the workflow to run'
        type: choice
        options:
          - test
        required: true
        default: 'test'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: abyss
  EXPECTED_VERSION: 0.1.0

jobs:
  # ===================================================================
  # Job 1: Fast Quality Gate (Format, Lint, Docs, Minimal Core)
  # ===================================================================
  quality_gate:
    name: Fast Quality Gate (fmt, clippy, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: quality-gate-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Doc-tests
        run: cargo test --doc --workspace --all-features

      - name: Check minimal abyss-core
        run: cargo check -p abyss-core --no-default-features

      - name: Check abyss-core documentation
        run: cargo doc -p abyss-core --all-features --no-deps

  # ===================================================================
  # Job 2: Multi-Platform Test Matrix (Gated by Quality Gate)
  # ===================================================================
  test_and_check:
    name: Test on ${{ matrix.target }}
    needs: quality_gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - runner: windows-latest
            target: x86_64-pc-windows-msvc

          - runner: macos-15
            target: x86_64-apple-darwin

          - runner: macos-14
            target: aarch64-apple-darwin

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf

          - runner: windows-latest
            target: aarch64-pc-windows-msvc

          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies for ARM cross-compile (Linux)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          fi

      - name: Configure cross-linker (Linux ARM)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          mkdir -p ~/.cargo "$HOME/bin"
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            cat > "$HOME/bin/arm-linux-gnueabihf-gcc-wrap" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-mno-omit-leaf-frame-pointer" ]]; then
              args+=("$arg")
            fi
          done
          exec arm-linux-gnueabihf-gcc "${args[@]}"
          EOF
            chmod +x "$HOME/bin/arm-linux-gnueabihf-gcc-wrap"
            echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
            echo "linker = \"$HOME/bin/arm-linux-gnueabihf-gcc-wrap\"" >> ~/.cargo/config.toml
            echo "CC_armv7_unknown_linux_gnueabihf=$HOME/bin/arm-linux-gnueabihf-gcc-wrap" >> "$GITHUB_ENV"
          fi

      - name: Build workspace
        if: matrix.target != 'x86_64-unknown-freebsd'
        run: cargo build --target ${{ matrix.target }} --workspace

      - name: Run tests
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'armv7-unknown-linux-gnueabihf' && matrix.target != 'aarch64-pc-windows-msvc' && matrix.target != 'x86_64-pc-windows-msvc' && matrix.target != 'x86_64-unknown-freebsd'
        run: cargo test --target ${{ matrix.target }} --workspace

      - name: Build and test in FreeBSD VM
        if: matrix.target == 'x86_64-unknown-freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          sync: rsync
          copyback: false
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            rustc -vV
            cargo build --workspace
            cargo test --workspace
